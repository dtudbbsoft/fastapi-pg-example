[tool.poetry]
name = "fast-api-server"
version = "0.1.0"
description = "Simple FastAPI application example"
authors = [
    "Dmytro Tiurin <dtu@dbbsoftware.com>"
]

readme = "README.md"

[tool.ruff]
extend = "../packages/common/pyproject.toml"

[tool.poetry.dependencies]
python = "3.11.6"
fastapi = "0.115.0"
uvicorn = { version = "0.30.1", extras = ["standard"] }
gunicorn = "22.0.0"
pydantic-settings = "2.6.1"
yarl = "1"
ujson = "5.10.0"
httptools = "0.6.1"
common = {path = "../packages/common"}
pydantic = "2.9.2"
httpx = "0.27.2"
fast-api-auth0 = {path = "../packages/fast-api-modules/auth0"}
fast-api-db = {path = "../packages/fast-api-modules/db", extras = ["postgresql"]}
fast-api-cloudwatch = {path = "../packages/fast-api-modules/cloudwatch"}

[tool.coverage.run]
branch = true
relative_files = true
omit = ["*/__init__.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
